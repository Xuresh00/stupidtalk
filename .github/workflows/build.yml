name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-app:
    name: Test and build the Mac app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Test the clean-up logic
        run: scripts/test.sh

      - name: Build StupidTalk.app
        run: scripts/build.sh dist
        env:
          STUPIDTALK_BUILD_NUMBER: ${{ github.run_number }}
          STUPIDTALK_DMG_DIR: dist

      - name: Check the app starts
        run: |
          APP_BIN=dist/StupidTalk.app/Contents/MacOS/StupidTalk
          otool -L "$APP_BIN" | grep CTranscribe
          otool -l "$APP_BIN" | grep -A2 LC_RPATH
          test -f dist/StupidTalk.app/Contents/Frameworks/CTranscribe.framework/Versions/Current/CTranscribe
          "$APP_BIN" &
          APP_PID=$!
          sleep 10
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "StupidTalk is running"
            kill "$APP_PID"
          else
            wait "$APP_PID" || true
            echo "StupidTalk quit right after starting" >&2
            exit 1
          fi

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: StupidTalk
          path: |
            dist/StupidTalk-*.dmg
            dist/StupidTalk-*.zip
          if-no-files-found: error
          retention-days: 14
