name: Release

# Run by hand from the Actions tab when a build from GitHub's Mac should become a release.
# Releases normally carry the disk image that was built and tested on the author's Mac.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test the clean-up logic
        run: scripts/test.sh

      - name: Build StupidTalk.app
        run: scripts/build.sh dist
        env:
          STUPIDTALK_BUILD_NUMBER: ${{ github.run_number }}
          STUPIDTALK_DMG_DIR: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/StupidTalk-*.dmg dist/StupidTalk-*.zip \
            --target "$GITHUB_SHA" \
            --title "StupidTalk ${TAG#v}" \
            --generate-notes
